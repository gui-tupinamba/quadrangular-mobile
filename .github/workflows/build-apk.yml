name: Build APK

# Execução manual: Actions > Build APK > Run workflow
on:
  workflow_dispatch:

jobs:
  apk:
    name: Gerar APK (release)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: gradle/actions/setup-gradle@v4

      - name: Instalar dependências
        run: npm ci

      - name: Gerar projeto Android nativo
        run: npx expo prebuild --platform android --clean
        env:
          # AJUSTE: use o nome real da variável que o app lê (gravada no build)
          EXPO_PUBLIC_API_URL: https://api.guitupinamba.dev/api

      - name: Compilar APK
        working-directory: android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon
        env:
          EXPO_PUBLIC_API_URL: https://api.guitupinamba.dev/api

      - name: Publicar APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 14
